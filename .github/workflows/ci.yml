name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg integration-test dependency
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: ./scripts/check.sh

  release-build:
    name: Release build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: transcribeit
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: transcribeit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: transcribeit.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-workspace-crates: false
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify release binary
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.binary }} --version
