name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg integration-test dependency
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: ./scripts/check.sh

  all-features:
    name: All features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg integration-test dependency
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Bootstrap verified Sherpa shared libraries
        run: ./scripts/bootstrap-sherpa.sh "$RUNNER_TEMP/sherpa"
      - name: Test all targets and features
        run: cargo test --all-targets --all-features
      - name: Clippy all targets and features
        run: cargo clippy --all-targets --all-features -- -D warnings
