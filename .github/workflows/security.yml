name: Security audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  rustsec:
    name: RustSec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 24 support is newer than the latest v2.0.0 release; keep this SHA
      # pinned until rustsec/audit-check publishes a release containing it.
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
