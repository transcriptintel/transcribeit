name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96
      - name: Verify tag ancestry and package version
        shell: bash
        run: |
          tag_sha=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "::error::Release tags must point to a commit reachable from main."
            exit 1
          fi
          tag_version=${GITHUB_REF_NAME#v}
          package_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "transcribeit") | .version')
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Tag version $tag_version does not match Cargo package version $package_version."
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: transcribeit
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            binary: transcribeit
          - os: macos-26-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: transcribeit
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: transcribeit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: transcribeit.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-workspace-crates: false
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          package="transcribeit-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$package"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" README.md LICENSE "$package/"
          tar czf "$package.tar.gz" "$package"
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $package = "transcribeit-${env:GITHUB_REF_NAME}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $package
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}", "README.md", "LICENSE" -Destination $package
          Compress-Archive -Path "$package/*" -DestinationPath "$package.zip"
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: transcribeit-${{ matrix.target }}
          path: transcribeit-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum transcribeit-* > checksums-sha256.txt
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/transcribeit-*
            artifacts/checksums-sha256.txt
